[project]
name = "aos-keel"
version = "0.3.0"
description = "AOS 模板生成系统 —— 基于本体论的 Agent 系统企业级模板（对应规范 v2.0.0）"
requires-python = ">=3.11"
# pytest 是 aos test / aos release 的执行引擎（一等命令，不是可选开发依赖）：
# 原先只有 CI 手工安装，纯净 pip install -e . 的 venv 会直接 No module named pytest。
dependencies = ["pyyaml>=6.0", "pytest>=8.0"]

[project.scripts]
aos = "src.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 显式列出包：src 依赖 sys.path 注入运行（P-5），不使用 __init__.py 常规布局。
# tools 一并打包，使 wheel 内的 CLI 能 import 并给出明确的"须从源码树运行"拒绝，
# 而不是裸 ImportError。注意：wheel 不含 docs/spec/config，不是可安装交付物；
# 模板唯一受支持的运行形态是源码树 + pip install -e .（见 docs/README.md）。
[tool.setuptools]
packages = ["src", "src.cli", "src.kernel", "src.interpreter", "src.generated",
            "src.agents", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
