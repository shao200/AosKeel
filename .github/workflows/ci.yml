# CI 门禁：模板验收 → 三关 → 发布闸门（fail-closed，VER-27 前置）。
# 语义与 docs/RUNBOOK.md BOOT-2 第 4 步一致；任何一关失败 → 不出制品。
name: aos-gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: aos-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 只按 pyproject 声明安装：CI 曾手工补装 pytest，掩盖了运行时依赖声明缺失，
      # 使纯净 venv 里 aos test / python -m pytest 失败而 CI 仍全绿。
      - run: pip install -e .
      - name: 派生文档同步（版本号/测试规模与真源一致）
        run: python -m tools.doc_sync --check
      - name: 模板验收（一致性 + forbidden 双射 + 解释器负向集）
        run: python -m pytest -q tests
      - name: 三关（结构指纹 → 密码学哈希 → declared==registered）
        run: python -m src.cli.main verify
      - name: 发布闸门（全绿才出制品；RELEASE-MANIFEST 落 dist/）
        run: python -m src.cli.main release
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: release-manifest
          path: dist/RELEASE-MANIFEST.json
